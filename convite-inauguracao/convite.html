<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Convite Inauguração TCH</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0C0C}
.c{width:1080px;height:1350px;position:relative;overflow:hidden;color:#FAF9F6;font-family:Montserrat,sans-serif;text-align:center;
  background:radial-gradient(ellipse 70% 45% at 50% 58%,#1C1914 0%,#0C0C0C 70%)}
.c *{font-variant-numeric:lining-nums}
.frame{position:absolute;inset:40px;border:1px solid rgba(198,166,103,.45)}
.frame::after{content:"";position:absolute;inset:10px;border:1px solid rgba(198,166,103,.18)}
.wave{position:absolute;left:-60px;top:930px;width:1200px;height:230px;opacity:.85}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.logo{margin-top:104px;width:190px}
.eyebrow{margin-top:64px;display:flex;align-items:center;gap:22px;font-size:17px;font-weight:500;letter-spacing:.42em;color:#C6A667}
.eyebrow i{width:56px;height:1px;background:#C6A667;opacity:.6}
h1{margin:26px 0 0;font-family:'Playfair Display',serif;font-weight:400;font-size:118px;line-height:1;letter-spacing:-.01em}
.sub{margin-top:18px;font-family:'Playfair Display',serif;font-style:italic;font-size:38px;color:#D9D4CA}
.data{margin-top:78px;display:flex;flex-direction:column;align-items:center}
.dow{font-size:18px;font-weight:500;letter-spacing:.5em;color:#D9D4CA;margin-left:.5em}
.num{margin-top:10px;font-family:'Playfair Display',serif;font-size:150px;line-height:1;color:#C6A667;letter-spacing:.02em}
.num span{display:inline-block;width:2px;height:110px;background:#5E5039;margin:0 34px;transform:rotate(18deg) translateY(6px)}
.hr{margin-top:16px;font-size:19px;font-weight:500;letter-spacing:.32em;color:#FAF9F6;margin-left:.32em}
.cond{margin-top:58px;font-size:24px;font-weight:300;line-height:1.55;color:#D9D4CA}
.cond b{font-weight:500;color:#C6A667}
.info{position:absolute;left:90px;right:90px;bottom:96px;display:grid;grid-template-columns:1fr 1.75fr 1fr;align-items:start;border-top:1px solid rgba(198,166,103,.3);padding-top:34px}
.info>div+div{border-left:1px solid rgba(198,166,103,.18)}
.lb{font-size:14px;font-weight:600;letter-spacing:.34em;color:#C6A667;margin-left:.34em}
.vl{margin-top:12px;font-size:21px;font-weight:400;color:#FAF9F6;line-height:1.35}
.story{height:1920px;background:radial-gradient(ellipse 80% 40% at 50% 52%,#1C1914 0%,#0C0C0C 70%)}
.story .logo{margin-top:250px;width:230px}
.story .eyebrow{margin-top:90px}
.story h1{font-size:128px}
.story .data{margin-top:120px}
.story .num{font-size:180px}
.story .num span{height:132px}
.story .cond{margin-top:90px}
.story .wave{top:1300px;height:220px}
.story .info{bottom:250px}
</style></head><body>
<div class="c" id="c">
  <div class="frame"></div>
  <svg class="wave" viewBox="0 0 360 150" preserveAspectRatio="none" fill="none" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8F713F"/><stop offset=".5" stop-color="#EBD7A4"/><stop offset="1" stop-color="#8F713F"/></linearGradient></defs><g stroke="url(#g)" stroke-width="1.1" vector-effect="non-scaling-stroke"><path d="M0 110C90 150 200 10 360 60" opacity="0.95"/><path d="M0 104C90 140 200 16 360 65" opacity="0.85"/><path d="M0 98C90 130 200 22 360 70" opacity="0.75"/><path d="M0 92C90 120 200 28 360 75" opacity="0.65"/><path d="M0 86C90 110 200 34 360 80" opacity="0.58"/><path d="M0 80C90 100 200 40 360 85" opacity="0.5"/><path d="M0 74C90 90 200 46 360 90" opacity="0.42"/><path d="M0 68C90 80 200 52 360 95" opacity="0.35"/><path d="M0 62C90 70 200 58 360 100" opacity="0.28"/><path d="M0 56C90 60 200 64 360 105" opacity="0.2"/></g></svg>
  <div class="in">
    <img class="logo" src="logo-vertical.png" alt="TCH Experiência">
    <div class="eyebrow"><i></i>CONVITE<i></i></div>
    <h1>Inauguração</h1>
    <div class="sub">Será um prazer receber você.</div>
    <div class="data">
      <div class="dow">SÁBADO</div>
      <div class="num">28<span></span>11</div>
      <div class="hr">10H · CAFÉ DA MANHÃ</div>
    </div>
    <div class="cond"><b>Condições especiais</b> exclusivas para o dia do evento.</div>
  </div>
  <div class="info">
    <div><div class="lb">WHATSAPP</div><div class="vl">(21) 99966-4099</div></div>
    <div><div class="lb">ENDEREÇO</div><div class="vl">Rod. Dr. José de Moura Estevão, 188<br>Loja 9 + Anexo · Teresópolis – RJ</div></div>
    <div><div class="lb">INSTAGRAM</div><div class="vl">@tch.experiencia</div></div>
  </div>
</div><script>if(location.search.includes("story"))document.getElementById("c").classList.add("story")</script></body></html>
