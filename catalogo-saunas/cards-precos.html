<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards de Preço A6</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#101010;--paper:#FAF9F6;--cream:#F3EFE7;--line:#E3DDD1;--gold:#C6A667;--gold-lt:#E9D39C;--gold-dk:#7A5F33;--muted:#5E5A53}
@page{size:105mm 148mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#2B2A27;font-family:Montserrat,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;flex-wrap:wrap;gap:8mm;justify-content:center;padding:8mm}
.card{width:105mm;height:148mm;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media print{body{background:none;padding:0;display:block}.card{break-after:page}}
.serif{font-family:'Playfair Display',serif;font-style:italic;font-weight:400}
.top{height:11mm;flex:none;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 6mm;position:relative}
.top img{height:4.6mm}
.top span{font-size:5pt;font-weight:600;letter-spacing:.26em;color:var(--gold)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-.5mm;height:.5mm;background:linear-gradient(90deg,#6E552D,#C6A667 40%,#F3E2B0 62%,#B8975A 85%,#6E552D)}
.body{flex:1;padding:9mm 7mm 0;display:flex;flex-direction:column}
.eyebrow{font-size:6.6pt;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-dk);display:flex;align-items:center;gap:2mm}
.eyebrow::before{content:"";width:6mm;height:.4mm;background:var(--gold)}
h1{margin:2.5mm 0 0;font-size:27pt;font-weight:600;line-height:1.05;letter-spacing:-.01em}
h1 .serif{color:var(--gold-dk)}
.price{margin-top:8mm;background:var(--ink);color:var(--paper);border-radius:2.5mm;padding:6mm 5mm 5mm;text-align:center}
.price .lbl{font-size:6.4pt;font-weight:600;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.price .v{font-size:38pt;font-weight:700;line-height:1;letter-spacing:-.01em;margin-top:2mm}
.price .v small{font-size:16pt;font-weight:500;color:var(--gold-lt);margin-right:.8mm}
.price .parc{margin-top:3.5mm;padding-top:3mm;border-top:1px solid rgba(198,166,103,.35);font-size:7.6pt;color:#D9D4CA}
.price .parc b{color:var(--paper);font-weight:600}
dl{margin:7mm 0 0;display:grid;grid-template-columns:1fr 1fr;gap:4.5mm 5mm}
dt{font-size:6pt;font-weight:600;letter-spacing:.18em;color:var(--gold-dk);text-transform:uppercase}
dd{margin:.8mm 0 0;font-size:9pt;font-weight:500;line-height:1.3}
.incl{margin-top:auto;margin-bottom:4mm;border-top:1px solid var(--line);padding-top:3mm;font-size:7.4pt;color:var(--muted);line-height:1.4}
.incl b{color:var(--ink);font-weight:600}
.foot{height:7mm;flex:none;background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:5.2pt;letter-spacing:.22em;color:#D9D4CA}
.foot b{color:var(--gold);font-weight:600;margin-right:1.5mm}
</style>
</head>
<body>
<script>
// Mesmos valores do catalogo.html (2026). Mudou preço lá? Mude aqui também.
const MODELS = [
  ['Moderna',2,6,'19.990','1,20 × 1,00 × 2,10 m'],
  ['Moderna',3,9,'24.990','1,80 × 1,10 × 2,10 m'],
  ['Moderna',4,9,'26.990','2,20 × 1,10 × 2,10 m'],
  ['Rústica',2,6,'21.990','1,20 × 1,00 × 2,10 m'],
  ['Rústica',3,9,'25.990','1,80 × 1,10 × 2,10 m'],
  ['Rústica',4,9,'27.990','2,20 × 1,10 × 2,10 m'],
  ['Rústica',5,9,'28.990','1,60 × 1,60 × 2,10 m'],
  ['Rústica',8,12,'34.990','2,10 × 1,70 × 2,25 m'],
];
document.write(MODELS.map(([line, n, kw, price, med]) => `
<section class="card">
  <header class="top"><img src="img/logo-horizontal.png" alt="TCH Experiência"><span>SAUNAS · 2026</span></header>
  <div class="body">
    <div class="eyebrow">Linha ${line.toLowerCase()}</div>
    <h1>Sauna ${line}<br><span class="serif">${n} lugares</span></h1>
    <div class="price">
      <div class="lbl">Valor à vista</div><div class="v"><small>R$</small>${price}</div>
      <div class="parc">ou em <b>até 24× no cartão</b> · consulte condições</div>
    </div>
    <dl>
      <div><dt>Capacidade</dt><dd>${n} lugares</dd></div>
      <div><dt>Gerador incluso</dt><dd>Vapor inox · ${kw} kW</dd></div>
      <div><dt>Medidas (C × P × A)</dt><dd>${med}</dd></div>
      <div><dt>Materiais</dt><dd>Ipê ou jatobá · vidro temperado</dd></div>
    </dl>
    <div class="incl"><b>Gerador e comando digital inclusos.</b> Opcionais e personalizações: consulte nossa equipe.</div>
  </div>
  <footer class="foot"><b>TCH EXPERIÊNCIA</b> SAUNAS SOB MEDIDA</footer>
</section>`).join(''));
</script>
</body>
</html>
