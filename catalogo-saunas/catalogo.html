<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de Saunas 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101010; --ink-2:#1A1917; --paper:#FAF9F6; --cream:#F3EFE7; --line:#E3DDD1;
  --gold:#C6A667; --gold-lt:#E9D39C; --gold-dk:#7A5F33; --muted:#5E5A53; --soft:#A39E95;
}
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#2B2A27;font-family:Montserrat,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;margin:10mm auto;background:var(--paper);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 30px rgba(0,0,0,.35)}
@media print{body{background:none}.page{margin:0;box-shadow:none;break-after:page}}
.serif{font-family:'Playfair Display',serif;font-style:italic;font-weight:400}
.gold{color:var(--gold)} .gold-dk{color:var(--gold-dk)}
.eyebrow{font-size:7.5pt;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-dk);display:flex;align-items:center;gap:3mm}
.eyebrow::before{content:"";width:8mm;height:.5mm;background:var(--gold)}
.waves{position:absolute;pointer-events:none}

/* faixa superior / rodapé das páginas internas */
.top{height:16mm;flex:none;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 14mm;position:relative}
.top img{height:6.2mm}
.top span{font-size:6.5pt;font-weight:500;letter-spacing:.28em;color:var(--gold)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-.6mm;height:.6mm;background:linear-gradient(90deg,#6E552D,#C6A667 40%,#F3E2B0 62%,#B8975A 85%,#6E552D)}
.body{flex:1;padding:11mm 14mm 0;display:flex;flex-direction:column;min-height:0}
.foot{height:11mm;flex:none;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 14mm;font-size:6.5pt;letter-spacing:.22em;color:#D9D4CA}
.foot b{color:var(--gold);font-weight:600}
.fine{font-size:7pt;color:var(--muted);line-height:1.5}
.deliver{margin-top:auto;padding:3mm 0 4mm;font-size:7pt;color:var(--muted)}

h1{margin:2.5mm 0 1.5mm;font-size:27pt;font-weight:600;line-height:1.05;letter-spacing:-.01em}
h1 .serif{color:var(--gold-dk);font-weight:400}
.sub{margin:0;font-size:9pt;color:var(--muted)}

/* produto */
.hero{display:grid;grid-template-columns:1fr 64mm;gap:5mm;margin-top:7mm;height:114mm}
.photo{position:relative;border-radius:2.5mm;overflow:hidden;background:var(--cream)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .tag{position:absolute;left:4mm;top:4mm;background:rgba(16,16,16,.82);color:var(--gold-lt);font-size:6.5pt;font-weight:600;letter-spacing:.2em;padding:2mm 3mm;border-radius:1mm}
.spec{background:var(--ink);color:var(--paper);border-radius:2.5mm;padding:6mm 5.5mm;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lbl{font-size:6.3pt;font-weight:600;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.price{font-size:25pt;font-weight:600;line-height:1.1;margin:1.5mm 0 1mm;letter-spacing:-.01em}
.price small{font-size:12pt;font-weight:500;margin-right:1mm;color:var(--gold-lt)}
.parc{font-size:8pt;color:#D9D4CA;line-height:1.45}
.parc b{color:var(--paper);font-weight:600}
.spec hr{border:0;height:1px;background:linear-gradient(90deg,var(--gold),rgba(198,166,103,.1));margin:5mm 0 4mm;width:100%}
.spec dl{margin:0;display:flex;flex-direction:column;gap:3.4mm}
.spec dd{margin:.8mm 0 0;font-size:8.6pt;line-height:1.4}
.incl{margin-top:5mm;border:1px solid var(--gold);background:var(--cream);border-radius:2mm;padding:3.2mm 4.5mm;display:flex;align-items:center;gap:3.5mm}
.incl svg{width:7mm;height:7mm;flex:none}
.incl b{display:block;font-size:7.6pt;letter-spacing:.14em;font-weight:700}
.incl span{font-size:8pt;color:var(--muted)}
.opts{margin-top:5mm;border:1px solid var(--line);background:#fff;border-radius:2.5mm;padding:5mm 5.5mm 4mm}
.opts-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:3mm;margin-bottom:1mm}
.opts-h h2{margin:0;font-size:12pt;font-weight:600}
.opts-h h2 .serif{color:var(--gold-dk)}
.opts-h>span{font-size:6.3pt;font-weight:600;letter-spacing:.2em;color:var(--gold-dk)}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm}
.row{display:flex;justify-content:space-between;align-items:center;gap:3mm;padding:2.3mm 0;border-bottom:1px dashed var(--line);font-size:8.2pt;line-height:1.3}
.row b{white-space:nowrap;font-weight:600}
.row em{font-style:normal;color:var(--muted);display:block;font-size:7.4pt}
.opts .fine{margin-top:3mm}

/* tabelas */
table{width:100%;border-collapse:collapse;font-size:8.6pt}
th{background:var(--ink);color:var(--gold);font-size:6.5pt;font-weight:600;letter-spacing:.2em;text-align:left;padding:3mm 4mm}
th:last-child,td:last-child{text-align:right}
td{padding:2.9mm 4mm;border-bottom:1px solid var(--line)}
td:first-child{font-weight:600}
td:last-child{font-weight:700}
tr:nth-child(even) td{background:var(--cream)}
.tbl{border-radius:2.5mm;overflow:hidden;border:1px solid var(--line);background:#fff}

/* capa */
.cover{background:var(--ink);color:var(--paper)}
.cover .head{display:flex;justify-content:space-between;align-items:center;padding:13mm 14mm 0;font-size:6.5pt;letter-spacing:.28em;color:#D9D4CA;position:relative;z-index:1}
.cover .logo{display:block;width:62mm;margin:9mm auto 0;position:relative;z-index:1}
.cover .title{text-align:center;margin:7mm 0 0;font-size:29pt;font-weight:600;line-height:1.05;position:relative;z-index:1}
.cover .title .serif{color:var(--gold);font-size:33pt}
.cover .shot{position:relative;margin:8mm 14mm 0;aspect-ratio:6/5;border-radius:2.5mm;overflow:hidden;outline:1px solid rgba(198,166,103,.55);outline-offset:2mm}
.cover .shot img{width:100%;height:100%;object-fit:cover;display:block}
.cover .badge{position:absolute;left:5mm;bottom:5mm;padding:2.6mm 4mm;background:var(--ink);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:6.3pt;font-weight:600;letter-spacing:.2em;color:var(--gold-lt)}
.cover .tagline{margin-top:auto;padding:0 14mm 16mm;position:relative;z-index:1}
.cover .tagline p{margin:0;font-size:13pt;font-weight:500;line-height:1.35}
.cover .tagline p .serif{color:var(--gold)}
.cover .tagline small{display:block;margin-top:2mm;font-size:7.5pt;letter-spacing:.06em;color:var(--soft)}

/* guia */
.lines{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-top:7mm}
.line{border:1px solid var(--line);border-radius:2.5mm;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.line img{width:100%;height:58mm;object-fit:cover;object-position:center 75%;display:block}
.line>div{padding:4.5mm 5mm 5mm;display:flex;flex-direction:column;flex:1}
.line h3{margin:1.5mm 0 1.5mm;font-size:15pt;font-weight:600}
.line h3 .serif{color:var(--gold-dk)}
.line p{margin:0;font-size:8pt;line-height:1.5;color:var(--muted)}
.line .cap{margin-top:auto;padding-top:3mm;border-top:1px solid var(--line);font-size:7.5pt;font-weight:600;letter-spacing:.06em}
.note{margin-top:5mm;background:var(--cream);border-left:0;border-radius:2mm;padding:3.5mm 4.5mm;font-size:8pt;line-height:1.5;color:var(--muted);border:1px solid var(--line)}
.note b{color:var(--ink)}

/* seca / piscina */
.duo{display:grid;grid-template-columns:78mm 1fr;gap:5mm;margin-top:7mm;height:104mm}
.card{border:1px solid var(--line);border-radius:2.5mm;background:#fff;padding:6mm}
.card h2{margin:0 0 3mm;font-size:13pt;font-weight:600}
.card h2 .serif{color:var(--gold-dk)}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2.6mm}
.card li{font-size:8.4pt;line-height:1.45;color:var(--muted);padding-left:5mm;position:relative}
.card li::before{content:"";position:absolute;left:0;top:1.9mm;width:2.4mm;height:.5mm;background:var(--gold)}
.card li b{color:var(--ink);font-weight:600}
.formula{margin-top:5mm;background:var(--ink);color:var(--paper);border-radius:2mm;padding:3.5mm 4.5mm;font-size:7pt;font-weight:600;letter-spacing:.14em;line-height:1.6}
.formula b{color:var(--gold)}
.sec-h{margin:7mm 0 1mm;font-size:13pt;font-weight:600}
.sec-h .serif{color:var(--gold-dk)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-top:7mm}
.pics .photo{aspect-ratio:1/1}

/* contracapa */
.back{background:var(--ink);color:var(--paper)}
.back .inner{padding:22mm 16mm 0;position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.back .sym{width:34mm}
.back h2{margin:16mm 0 0;font-size:31pt;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.back h2 .serif{display:block;color:var(--gold);font-size:36pt;margin-top:1mm}
.back p{margin:6mm 0 0;max-width:120mm;font-size:10pt;line-height:1.6;color:#D9D4CA}
.contact{margin-top:auto;border:1px solid rgba(198,166,103,.6);border-radius:2.5mm;padding:7mm 8mm;display:grid;grid-template-columns:1fr auto;gap:2mm 10mm;align-items:end;background:rgba(255,255,255,.02)}
.contact .lbl{grid-column:1/-1}
.contact .tel{font-size:20pt;font-weight:600;margin-top:1mm}
.contact ul{margin:0;padding:0;list-style:none;font-size:9pt;line-height:1.8;color:#D9D4CA;text-align:right}
.back .legal{padding:8mm 16mm 12mm;font-size:6.8pt;letter-spacing:.04em;color:var(--soft);text-align:center;position:relative;z-index:1}
.back .legal img{display:block;height:6mm;margin:0 auto 5mm}
</style>
</head>
<body>
<main id="book"></main>

<script>
const TOTAL = 13;
const WAVES = (w, h, n = 22, op = 1) => {
  // padrão gráfico da marca: feixe de linhas douradas
  let p = '';
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), o = (0.18 + 0.7 * Math.sin(Math.PI * t)) * op;
    const y0 = h * (0.62 + 0.36 * t), y1 = h * (0.30 + 0.16 * t);
    p += `<path d="M-10 ${y0.toFixed(1)} C ${w*.35} ${(y0+h*.04).toFixed(1)}, ${w*.65} ${(y1-h*.1).toFixed(1)}, ${w+10} ${y1.toFixed(1)}" opacity="${o.toFixed(2)}"${i===Math.round(n*.6)?' stroke="url(#wl)" stroke-width="2.2"':''}/>`;
  }
  return `<svg class="waves" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" fill="none" aria-hidden="true"><defs>
  <linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#6E552D"/><stop offset=".4" stop-color="#C6A667"/><stop offset=".62" stop-color="#E9D39C"/><stop offset=".85" stop-color="#B8975A"/><stop offset="1" stop-color="#6E552D"/></linearGradient>
  <linearGradient id="wl" x1="0" x2="1"><stop offset="0" stop-color="#6E552D" stop-opacity=".4"/><stop offset=".5" stop-color="#F3E2B0"/><stop offset="1" stop-color="#8F713F" stop-opacity=".5"/></linearGradient></defs>
  <g stroke="url(#wg)" stroke-width="1">${p}</g></svg>`;
};
const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="#7A5F33" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>`;
const topBar = () => `<header class="top"><img src="img/logo-horizontal.png" alt="TCH Experiência"><span>CATÁLOGO DE SAUNAS · 2026</span></header>`;
const foot = n => `<footer class="foot"><span><b>TCH EXPERIÊNCIA</b> · CATÁLOGO DE SAUNAS 2026</span><span>${String(n).padStart(2,'0')} / ${TOTAL}</span></footer>`;
const inner = (n, html) => `<section class="page">${topBar()}<div class="body">${html}</div>${foot(n)}</section>`;
const row = ([name, price, extra]) => `<div class="row"><span>${name}${extra ? `<em>${extra}</em>` : ''}</span><b>R$ ${price}</b></div>`;
const DELIVER = `<div class="deliver">Entrega prevista: 30 dias · Frete não incluso. Consulte peso e instalação com a equipe.</div>`;

const BASE = [['Ducha manual cromada ou preta','490']];
const NOTE_R = 'Opcionais são adicionais ao valor da cabine.';
const MODELS = [
  {line:'Moderna', n:2, kw:6, price:'19.990', parc:'2.222', med:'1,20 × 1,00 × 2,10 m', img:'moderna-2',
   ops:[['Ducha manual em inox','490'],['Iluminação blindada','690'],['Painel Smart','990'],['Antessala com ducha','9.997']],
   note:'Teto em madeira, conversão para seca e integração com piscina: somente na linha rústica.'},
  {line:'Moderna', n:3, kw:9, price:'24.990', parc:'2.777', med:'1,80 × 1,10 × 2,10 m', img:'moderna-3',
   ops:[...BASE,['Iluminação blindada','790'],['Painel Smart','990'],['Antessala com ducha','9.997']], note:'Teto em madeira, conversão para seca e integração com piscina: somente na linha rústica.'},
  {line:'Moderna', n:4, kw:9, price:'26.990', parc:'2.999', med:'2,20 × 1,10 × 2,10 m', img:'moderna-4',
   ops:[...BASE,['Iluminação blindada','890'],['Painel Smart','990'],['Antessala com ducha','9.997']], note:'Teto em madeira, conversão para seca e integração com piscina: somente na linha rústica.'},
  {line:'Rústica', n:2, kw:6, price:'21.990', parc:'2.444', med:'1,20 × 1,00 × 2,10 m', img:'rustica-2',
   ops:[...BASE,['Iluminação blindada','990'],['Painel Smart','990'],['Teto em madeira','1.990'],['Conversão para seca','1.990','+ fundo madeira (1 pessoa)'],['Antessala com ducha','9.997']],
   note:'Integração com piscina disponível apenas nas rústicas de 3, 4, 5 e 8 lugares.'},
  {line:'Rústica', n:3, kw:9, price:'25.990', parc:'2.888', med:'1,80 × 1,10 × 2,10 m', img:'rustica-3',
   ops:[...BASE,['Iluminação blindada','990'],['Painel Smart','990'],['Teto em madeira','2.990'],['Conversão para seca','2.990','+ fundo madeira (2 pessoas)'],['Integração com piscina','12.000','+ avanço de 80 cm'],['Antessala com ducha','9.997']], note:NOTE_R},
  {line:'Rústica', n:4, kw:9, price:'27.990', parc:'3.110', med:'2,20 × 1,10 × 2,10 m', img:'rustica-4',
   ops:[...BASE,['Iluminação blindada','1.090'],['Painel Smart','990'],['Teto em madeira','3.990'],['Conversão para seca','3.490','+ fundo madeira (3 pessoas)'],['Integração com piscina','12.000','+ avanço de 80 cm'],['Antessala com ducha','9.997']], note:NOTE_R},
  {line:'Rústica', n:5, kw:9, price:'28.990', parc:'3.222', med:'1,60 × 1,60 × 2,10 m', img:'rustica-5',
   ops:[...BASE,['Iluminação blindada','1.490'],['Painel Smart','990'],['Teto em madeira','3.990'],['Conversão para seca','4.490','+ fundo madeira (4 pessoas)'],['Integração com piscina','12.000','+ avanço de 80 cm'],['Antessala com ducha','9.997']], note:NOTE_R},
  {line:'Rústica', n:8, kw:12, price:'34.990', parc:'3.888', med:'2,10 × 1,70 × 2,25 m', img:'rustica-8',
   ops:[...BASE,['Iluminação blindada','1.990'],['Painel Smart','990'],['Teto em madeira','5.490'],['Conversão para seca','3.490','+ fundo madeira (7 pessoas)'],['Integração com piscina','12.000','+ avanço de 80 cm'],['Antessala com ducha','9.997']], note:NOTE_R},
];

const pages = [];

// 01 capa
pages.push(`<section class="page cover">
  ${WAVES(800, 1130, 26, .55).replace('class="waves"', 'class="waves" style="inset:0;width:100%;height:100%"')}
  <div class="head"><span>CATÁLOGO DE CABINES</span><span class="gold">2026</span></div>
  <img class="logo" src="img/logo-vertical.png" alt="TCH Experiência">
  <h1 class="title">Catálogo de <span class="serif">Saunas</span></h1>
  <div class="shot"><img src="img/capa-piscina.jpg" alt="Sauna rústica integrada à piscina" style="object-position:center 62%"><div class="badge">MODERNAS · RÚSTICAS · INTEGRADAS</div></div>
  <div class="tagline"><p>Design, conforto e tecnologia<br>para <span class="serif">valorizar seu ambiente.</span></p><small>Modelos, dimensões, preços e personalização.</small></div>
</section>`);

// 02 guia
pages.push(inner(2, `
  <div class="eyebrow">Guia de modelos</div>
  <h1>Encontre a sauna <span class="serif">ideal</span></h1>
  <p class="sub">Mais detalhes nas páginas a seguir.</p>
  <div class="lines">
    <div class="line"><img src="img/linha-moderna.jpg" alt="Sauna da linha Moderna"><div><div class="eyebrow">Linha 01</div><h3><span class="serif">Moderna</span></h3><p>Design limpo com vidro temperado e estrutura em madeiras nobres. Configuração de sauna úmida.</p><div class="cap">2, 3 e 4 lugares</div></div></div>
    <div class="line"><img src="img/linha-rustica.jpg" alt="Sauna da linha Rústica"><div><div class="eyebrow">Linha 02</div><h3><span class="serif">Rústica</span></h3><p>Estrutura em madeira com opções de teto, conversão para seca e integração à piscina.</p><div class="cap">2, 3, 4, 5 e 8 lugares</div></div></div>
  </div>
  <div class="tbl" style="margin-top:6mm"><table>
    <thead><tr><th>MODELO</th><th>CAPACIDADE · POTÊNCIA</th><th>À VISTA</th></tr></thead>
    <tbody>${MODELS.map(m => `<tr><td>${m.line} ${m.n} lugares</td><td>${m.n} lugares · ${m.kw} kW</td><td>R$ ${m.price}</td></tr>`).join('')}</tbody>
  </table></div>
  <div class="note"><b>Já está incluso na cabine:</b> gerador de vapor elétrico, quadro digital de controle e estrutura da sauna. Opcionais são cobrados separadamente; frete não incluso.</div>
`));

// 03–10 produtos
MODELS.forEach((m, i) => {
  const half = Math.ceil(m.ops.length / 2);
  pages.push(inner(i + 3, `
    <div class="eyebrow">Linha ${m.line.toLowerCase()}</div>
    <h1>${m.line} <span class="serif">${m.n} lugares</span></h1>
    <p class="sub">Sauna úmida para áreas internas e externas.</p>
    <div class="hero">
      <div class="photo"><img src="img/${m.img}.jpg" alt="Sauna ${m.line} ${m.n} lugares instalada"><span class="tag">LINHA ${m.line.toUpperCase()}</span></div>
      <div class="spec">
        ${WAVES(240, 420, 14, .5).replace('class="waves"', 'class="waves" style="left:0;bottom:0;width:100%;height:46%;opacity:.55"')}
        <div class="lbl">Valor à vista</div>
        <div class="price"><small>R$</small>${m.price}</div>
        <div class="parc">ou em <b>até 24× no cartão</b><br>consulte condições</div>
        <hr>
        <dl>
          <div><dt class="lbl">Capacidade</dt><dd>${m.n} lugares</dd></div>
          <div><dt class="lbl">Medidas (C × P × A)</dt><dd>${m.med}</dd></div>
          <div><dt class="lbl">Gerador incluso</dt><dd>Vapor elétrico inox · ${m.kw} kW</dd></div>
          <div><dt class="lbl">Materiais</dt><dd>Ipê ou jatobá<br>Vidro temperado</dd></div>
        </dl>
      </div>
    </div>
    <div class="incl">${CHECK}<div><b>GERADOR E COMANDO DIGITAL INCLUSOS</b><span>Cabine completa + gerador de vapor em inox + quadro digital de controle.</span></div></div>
    <div class="opts">
      <div class="opts-h"><h2>Personalize <span class="serif">sua sauna</span></h2><span>OPCIONAIS / ACRÉSCIMOS</span></div>
      <div class="grid2"><div>${m.ops.slice(0, half).map(row).join('')}</div><div>${m.ops.slice(half).map(row).join('')}</div></div>
      <div class="fine">${m.note}</div>
    </div>
    ${DELIVER}
  `));
});

// 11 sauna seca
const SECA = [['Rústica 2 lugares','1 pessoa','23.980'],['Rústica 3 lugares','2 pessoas','28.980'],['Rústica 4 lugares','3 pessoas','31.480'],['Rústica 5 lugares','4 pessoas','33.480'],['Rústica 8 lugares','7 pessoas','38.480']];
pages.push(inner(11, `
  <div class="eyebrow">Personalização</div>
  <h1>Sauna <span class="serif">seca</span></h1>
  <p class="sub">Disponível somente na linha rústica, com valor final já calculado.</p>
  <div class="duo">
    <div class="photo"><img src="img/sauna-seca.jpg" alt="Sauna rústica na versão seca"></div>
    <div class="card" style="display:flex;flex-direction:column">
      <h2>O que muda na <span class="serif">versão seca?</span></h2>
      <ul>
        <li><b>Fundo fechado em madeira</b> para maior conforto térmico.</li>
        <li><b>Aquecedor elétrico com pedras</b> fica dentro da cabine.</li>
